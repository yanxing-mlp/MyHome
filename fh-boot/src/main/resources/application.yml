spring:
  application:
    name: family-home-server

  profiles:
    active: dev

  servlet:
    multipart:
      # 图片走前端压缩（长边 2560、转 JPEG），文档一般也就几 MB；真正吃这一档的是视频管理——
      # 手机原片动辄几百 MB，所以单文件上限抬到 500MB。视频上传是流式落盘（FileStorageWriter.writeVideoStream），
      # 不整块读进内存，但 Spring 仍会先把整个 multipart 缓冲到临时目录，故上限即单支视频的最大体积。
      max-file-size: 500MB
      # 一次只传一支视频，请求体上限与单文件对齐（多留一点余量给表单字段）
      max-request-size: 512MB

  flyway:
    enabled: true
    # 一域一目录（方案 §3.2 约束 3）。四个目录共用一张 flyway_schema_history，
    # 所以版本号必须全局唯一 —— 约定每个域占一个号段：
    #   file   -> V1xx
    #   album  -> V2xx
    #   recipe -> V3xx
    #   vault  -> V4xx
    #   user   -> V5xx
    # 这样各域独立加迁移不会撞版本号，将来按域拆库时直接整目录搬走。
    # 注意：**已应用的迁移文件不能再改**，改了 checksum 会让 validate-on-migrate 直接启动失败
    # （给已上线的表加列只能新开一条，见 album/V201__add_album_image_pinned.sql）。
    locations:
      - classpath:db/migration/file
      - classpath:db/migration/album
      - classpath:db/migration/recipe
      - classpath:db/migration/vault
      - classpath:db/migration/user
    # 【号段方案的必要配套】out-of-order 必须为 true，否则号段设计直接跑不起来。
    # 实测踩到：库里已应用 100/200/300/301，album 域新开一条 V201 时 Flyway 报
    #   "Detected resolved migration not applied to database: 201. To allow executing
    #    this migration, set -outOfOrder=true."
    # 因为 201 < 已应用的最大版本 301，Flyway 默认策略认定它是"漏掉的乱序迁移"而拒绝。
    # 共用一张 history 表 + 各域独立号段，就意味着"版本小的迁移一定可能后出现"，
    # 这不是异常而是设计的本意，所以显式允许乱序。
    # 代价：写错一个更小的版本号不会被拦下来，只能靠号段约定 + review 兜（方案 §10 风险 12）。
    out-of-order: true
    table: flyway_schema_history
    baseline-on-migrate: true
    encoding: UTF-8
    validate-on-migrate: true

mybatis-plus:
  # classpath* 而不是 classpath：mapper XML 分散在各 biz 模块的 jar 里，必须跨 jar 扫描
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.familyhome.file.biz.entity,com.familyhome.album.biz.entity,com.familyhome.recipe.biz.entity,com.familyhome.vault.biz.entity,com.familyhome.user.biz.entity
  configuration:
    map-underscore-to-camel-case: true
    # 三态 status 存枚举名，靠 MyBatis 默认的 EnumTypeHandler（按 name() 存取），不需要额外配置
  global-config:
    banner: false
    db-config:
      id-type: auto
      # 刻意不配 logic-delete-field：
      #   recipe / album_image 是三态 status，@TableLogic 用不了（"未删除"有两个值），
      #   必须在每个查询里手写 status <> 'DELETED'（方案 §10 风险 5）；
      #   album_group / vault_account 是两态 deleted，在实体字段上单独标 @TableLogic。
      # 全局配一个 logic-delete-field 会让两种机制互相干扰，所以留空。

server:
  port: 8080
  shutdown: graceful

# 文件存储（方案 §6.1）。一期只有 LocalStorageClient 一个实现，
# 刻意不做 fh.storage.type 开关 —— 只有一个实现时那是死代码。
fh:
  storage:
    root: /data/family-home/files
    url-prefix: /files

  # 密码本（v5 需求）。口令用 AES-256-GCM 可逆加密存储，密钥在这里。
  # 刻意留空 + 由各 profile 覆盖：Base64 的 32 字节，VaultCipherManager 启动时校验，
  # 配错/漏配直接启动失败（不能拖到第一次解密才发现，那时已经有条目用错密钥入库了）。
  # 生成方式：openssl rand -base64 32
  vault:
    password-key: ""

  # 口令的**传输段**加密（v11）。前端提交前加密、服务端在业务入口解密；密码本 reveal 反向。
  # 这跟上面那个 vault 密钥是两件事：vault 的密钥管"库里怎么存"，这一串只管"路上怎么说"。
  # 同样刻意留空、同样由 TransportCipher 构造时校验（至少 16 字符、纯 ASCII），漏配就启动失败。
  # ⚠️ 这一串必须与前端 packages/shared/src/crypto/transport.ts 的默认值/构建期变量逐字符相同。
  # 生成方式：openssl rand -hex 16
  transport-crypto:
    salt: ""
