spring:
  application:
    name: family-home-server

  profiles:
    active: dev

  servlet:
    multipart:
      # 图片走前端压缩（长边 2560、转 JPEG），文档一般也就几 MB；真正吃这一档的是视频管理——
      # 手机原片动辄几百 MB，所以单文件上限抬到 500MB。视频上传是流式落盘（FileStorageWriter.writeVideoStream），
      # 不整块读进内存，但 Spring 仍会先把整个 multipart 缓冲到临时目录，故上限即单支视频的最大体积。
      max-file-size: 500MB
      # 一次只传一支视频，请求体上限与单文件对齐（多留一点余量给表单字段）
      max-request-size: 512MB

  flyway:
    enabled: true
    # 一域一目录（方案 §3.2 约束 3）。四个目录共用一张 flyway_schema_history，
    # 所以版本号必须全局唯一 —— 约定每个域占一个号段：
    #   file   -> V1xx
    #   album  -> V2xx
    #   recipe -> V3xx
    #   vault  -> V4xx
    #   user   -> V5xx
    #   system -> V6xx（跨域运维/审计，fh-boot 直接持有：操作记录 operation_log 等）
    # 这样各域独立加迁移不会撞版本号，将来按域拆库时直接整目录搬走。
    # 注意：**已应用的迁移文件不能再改**，改了 checksum 会让 validate-on-migrate 直接启动失败
    # （给已上线的表加列只能新开一条，见 album/V201__add_album_image_pinned.sql）。
    locations:
      - classpath:db/migration/file
      - classpath:db/migration/album
      - classpath:db/migration/recipe
      - classpath:db/migration/vault
      - classpath:db/migration/user
      - classpath:db/migration/system
    # 【号段方案的必要配套】out-of-order 必须为 true，否则号段设计直接跑不起来。
    # 实测踩到：库里已应用 100/200/300/301，album 域新开一条 V201 时 Flyway 报
    #   "Detected resolved migration not applied to database: 201. To allow executing
    #    this migration, set -outOfOrder=true."
    # 因为 201 < 已应用的最大版本 301，Flyway 默认策略认定它是"漏掉的乱序迁移"而拒绝。
    # 共用一张 history 表 + 各域独立号段，就意味着"版本小的迁移一定可能后出现"，
    # 这不是异常而是设计的本意，所以显式允许乱序。
    # 代价：写错一个更小的版本号不会被拦下来，只能靠号段约定 + review 兜（方案 §10 风险 12）。
    out-of-order: true
    table: flyway_schema_history
    baseline-on-migrate: true
    encoding: UTF-8
    validate-on-migrate: true

mybatis-plus:
  # classpath* 而不是 classpath：mapper XML 分散在各 biz 模块的 jar 里，必须跨 jar 扫描
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.familyhome.file.biz.entity,com.familyhome.album.biz.entity,com.familyhome.recipe.biz.entity,com.familyhome.vault.biz.entity,com.familyhome.user.biz.entity
  configuration:
    map-underscore-to-camel-case: true
    # 三态 status 存枚举名，靠 MyBatis 默认的 EnumTypeHandler（按 name() 存取），不需要额外配置
  global-config:
    banner: false
    db-config:
      id-type: auto
      # 刻意不配 logic-delete-field：
      #   recipe / album_image 是三态 status，@TableLogic 用不了（"未删除"有两个值），
      #   必须在每个查询里手写 status <> 'DELETED'（方案 §10 风险 5）；
      #   album_group / vault_account 是两态 deleted，在实体字段上单独标 @TableLogic。
      # 全局配一个 logic-delete-field 会让两种机制互相干扰，所以留空。

server:
  port: 8080
  shutdown: graceful

# 日志格式（v46）：只覆盖「级别」这一段的模式，把 traceId 注入进去。
# Spring Boot 默认的控制台/文件 pattern 在级别位置用的是 ${LOG_LEVEL_PATTERN:-%5p}，
# 所以只改 logging.pattern.level 就能让控制台与文件两条 appender 的每一行都带上 [traceId]，
# 无需重写整条 pattern（各 profile 的 logging.level.* 与此互不影响，会一并生效）。
# traceId 由 TraceIdFilter 每请求写进 MDC；非请求线程（启动、@Scheduled）MDC 里没有它，
# 模式里的 `:-` 兜底成空——日志照常打，只是方括号内为空。系统日志页据此按 traceId 过滤出一次操作的关联日志。
logging:
  pattern:
    level: "%5p [%X{traceId:-}]"

# 文件存储（方案 §6.1）。一期只有 LocalStorageClient 一个实现，
# 刻意不做 fh.storage.type 开关 —— 只有一个实现时那是死代码。
fh:
  storage:
    root: /data/family-home/files
    url-prefix: /files

  # 单端口托管前端（Topology A，方案 v57）。部署机不再跑 Vite dev server：由本进程把两份**已构建**的
  # 前端产物当静态资源发出，前后端同源，无需任何反向代理。两个目录都由部署脚本注入环境变量，指向解包后的
  # admin/h5 的 dist；WebMvcConfig 据此把 admin 挂到 /admin/**、h5 挂到 /**，并对前端路由回退 index.html。
  # 留空即不启用（开发机两个前端各跑各的 Vite dev server 5173/5174，后端只出 /api 与 /files，行为不变）。
  web:
    admin-dir: ${FH_WEB_ADMIN_DIR:}
    h5-dir: ${FH_WEB_H5_DIR:}

  # 密码本（v5 需求）。口令用 AES-256-GCM 可逆加密存储，密钥在这里。
  # 刻意留空 + 由各 profile 覆盖：Base64 的 32 字节，VaultCipherManager 启动时校验，
  # 配错/漏配直接启动失败（不能拖到第一次解密才发现，那时已经有条目用错密钥入库了）。
  # 生成方式：openssl rand -base64 32
  vault:
    password-key: ""

  # 口令的**传输段**加密（v11）。前端提交前加密、服务端在业务入口解密；密码本 reveal 反向。
  # 这跟上面那个 vault 密钥是两件事：vault 的密钥管"库里怎么存"，这一串只管"路上怎么说"。
  # 同样刻意留空、同样由 TransportCipher 构造时校验（至少 16 字符、纯 ASCII），漏配就启动失败。
  # ⚠️ 这一串必须与前端 packages/shared/src/crypto/transport.ts 的默认值/构建期变量逐字符相同。
  # 生成方式：openssl rand -hex 16
  transport-crypto:
    salt: ""

  # 变更记录（v39）。默认「实时优先 + 烘焙快照兜底」：起服务后先去 GitHub 拉当前分支最近一页提交，
  # 拉不到（断网/限流/超时）才回退到构建期 gen-change-log.py 烘进 classpath 的 git/change-log.json。
  # 离线目标机断网：把 github-enabled 置 false，直接只读快照，省掉每次刷新都等一次网络超时。
  change-log:
    github-enabled: true
    github-api-base: https://api.github.com
    timeout-seconds: 8
    # 两仓都是公开库，匿名拉取受 GitHub 60 次/小时/IP 限制，靠短缓存挡住高频刷新。
    cache-seconds: 60
    # 「当前运行版本」= 本仓上次重启时那份代码的 commit。源码直跑（一键部署包）下由部署脚本启动后端时
    # 注入 FH_RUNNING_COMMIT_SERVER / FH_RUNNING_COMMIT_WEB（各自 git rev-parse HEAD）；开发机 / 旧离线包
    # 没有这两个环境变量时留空，ChangeLogService 回退到构建期烘焙快照顶部。
    running-commit-server: ${FH_RUNNING_COMMIT_SERVER:}
    running-commit-web: ${FH_RUNNING_COMMIT_WEB:}

  # 部署管理（离线部署包）。后端只读地报告当前运行版本（读 <FH_INSTALL_DIR>/app/version.json）与部署历史，
  # 不再有任何在线升级触发：更新由使用者手动放置新的离线部署包并跑部署脚本完成。
  deploy:
    # 部署历史：部署脚本每次跑到终态（done/failed）就把这一条追加进这个 JSON 数组文件（新在前、上限 50）。
    # 后端只读不写——写的人是能活过后端之死的分离部署进程。
    # 留空即视为未接入，历史接口直接返回空数组（不是报错：没有历史和无历史文件是一回事）。
    history-file: ${FH_DEPLOY_HISTORY_FILE:}

  # 「知识库」（系统后台菜单，方案 v49）。在线浏览/编辑一个已有 git 工作副本里的文本文件，并一键推送到远端。
  # repo-dir 指向该仓库在本机的目录（部署机上通常是 MyHome--Knowledge 的 clone）。留空即视为「当前环境未接入
  # 知识库」：文件树接口回 available=false，前端显示空态（与系统日志页 dev 空态同一手法），读/写/推送接口 400 拒绝。
  # git-ssh-command 可选：远端是 SSH 地址且需要指定私钥时注入 GIT_SSH_COMMAND（个人 GitHub 走独立 key），留空用 git 默认凭据链。
  knowledge:
    repo-dir: ${FH_KNOWLEDGE_REPO_DIR:}
    git-ssh-command: ${FH_KNOWLEDGE_GIT_SSH_COMMAND:}

  # 「代码仓库」（系统后台菜单，方案 v51）：在线浏览/编辑后端(server)与前端(web)源码 git 工作副本里的文本文件，
  # 并一键推送到远端。与知识库同一套引擎、同一口径，只是这里有两个仓库、各自独立配置目录与独立权限码门禁
  # （server-repo.access / web-repo.access）。部署机上 server.dir 通常指向 MyHome 的 clone、web.dir 指向
  # MyHome-React 的 clone；任一留空即视为「当前环境未接入该仓库」：文件树回 available=false、前端空态，
  # 读/写/推送 400 拒绝。git-ssh-command 可选：远端是 SSH 地址且需指定私钥时注入 GIT_SSH_COMMAND（个人 GitHub 走独立 key）。
  repo:
    server:
      dir: ${FH_SERVER_REPO_DIR:}
      git-ssh-command: ${FH_SERVER_REPO_GIT_SSH_COMMAND:}
    web:
      dir: ${FH_WEB_REPO_DIR:}
      git-ssh-command: ${FH_WEB_REPO_GIT_SSH_COMMAND:}

  # 「数据库」（系统后台菜单，方案 v52）：可视化浏览表 / 行内增删查改 / 结构化改表结构 / 跑任意 SQL / 每日备份。
  # 备份目录不单独配——它锚定在后端自身日志文件 logging.file.name 的「祖父目录 / backups」（即 logs 的同级目录），
  # 与 LogService 锚定日志目录同一手法：部署脚本已注入 LOGGING_FILE_NAME=<install>/logs/server.log，故备份自动落到
  # <install>/backups，无需再配一个目录。开发机没有 logging.file.name → 备份目录为 null → 备份能力优雅退化（available=false）。
  # mysqldump-path 可选：部署机上 mysqldump 通常不在 PATH（Windows 在 <mysql>/bin），由脚本注入绝对路径；留空则按 PATH 找
  # mysqldump（开发机 brew、unix 系统包都在 PATH）。找不到 mysqldump 或没有备份目录时，「立即备份 / 每日备份」不可用，其余
  # 浏览/改数据/改结构/跑 SQL 能力照常（它们走后端自己的 JDBC 连接，不依赖 mysqldump）。
  database:
    mysqldump-path: ${FH_MYSQLDUMP_PATH:}
