# 生产环境：容器内运行，连接参数全部走环境变量（方案 §8.2 的 docker-compose）
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:family_home}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      pool-name: fh-prod-pool

logging:
  level:
    root: info
    com.familyhome: info
  file:
    name: /data/family-home/logs/server.log

fh:
  storage:
    # 必须与 docker-compose 里挂载到 server 容器的宿主机路径一致
    root: /data/family-home/files
  vault:
    # 只从环境变量注入，**不落仓库、不进镜像**。漏配时 VaultCipherManager 会启动失败（预期行为）。
    # 生成：openssl rand -base64 32 ；写法与 compose 里其它 secret 一致（env_file 或 secrets）。
    password-key: ${FH_VAULT_PASSWORD_KEY:}
